name: Build iOS (Capacitor)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Modo de compilación'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build-ios:
    name: Compilar iOS en macOS
    runs-on: macos-14

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias del contenedor móvil
        working-directory: mobile
        run: |
          npm ci || npm install

      - name: Inicializar y sincronizar plataforma iOS
        working-directory: mobile
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Instalar CocoaPods
        working-directory: mobile/ios/App
        run: |
          pod install

      - name: Compilar proyecto Xcode (Sin firma para artefacto de prueba)
        working-directory: mobile/ios/App
        run: |
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration ${{ github.event.inputs.build_mode || 'Debug' }} \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || true

      - name: Comprimir y subir artefacto de la App iOS
        uses: actions/upload-artifact@v4
        with:
          name: eband-ios-${{ github.event.inputs.build_mode || 'Debug' }}
          path: mobile/ios/App/build/
          if-no-files-found: warn
