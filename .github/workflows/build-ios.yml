name: Build iOS (Capacitor)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Modo de compilación'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-ios:
    name: Compilar y Empaquetar iOS (.ipa)
    runs-on: macos-15

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias del contenedor móvil
        working-directory: mobile
        run: |
          npm ci || npm install

      - name: Sincronizar Capacitor con iOS
        working-directory: mobile
        run: |
          npx cap sync ios

      - name: Instalar CocoaPods
        working-directory: mobile/ios/App
        run: |
          pod install

      - name: Configurar Keychain temporal e importar certificado
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "Configurando llavero temporal efímero..."
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          CERTIFICATE_PATH="$RUNNER_TEMP/build_cert.p12"

          # Enmascarar contraseña en los logs de GitHub Actions
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          # Exportar variables de entorno para pasos posteriores y limpieza
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
          echo "CERTIFICATE_PATH=$CERTIFICATE_PATH" >> $GITHUB_ENV

          # Eliminar llavero previo si existiese
          rm -f "$KEYCHAIN_PATH"

          # 1. Crear llavero temporal
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 2. Configurar timeout para evitar bloqueo automático durante la compilación (6 horas = 21600 segundos)
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          # 3. Desbloquear llavero
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 4. Añadir a la lista de búsqueda de dominios de usuario preservando llaveros existentes
          ORIGINAL_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $ORIGINAL_KEYCHAINS

          # 5. Establecer como llavero por defecto
          security default-keychain -s "$KEYCHAIN_PATH"

          # 6. Decodificar e importar el certificado .p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -f pkcs12

          # 7. Conceder permisos a codesign en la lista de particiones para evitar prompts de UI
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Certificado importado y llavero configurado con éxito."

      - name: Instalar perfil de aprovisionamiento
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          echo "Instalando perfil de aprovisionamiento..."
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$RUNNER_TEMP/distribution.mobileprovision"
          echo "PROFILE_PATH=$PROFILE_PATH" >> $GITHUB_ENV

          # Decodificar el perfil de aprovisionamiento
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          # Extraer dinámicamente el UUID del perfil (usando plutil con fallbacks a PlistBuddy y grep/sed)
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw - 2>/dev/null || \
                         security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin 2>/dev/null || \
                         security cms -D -i "$PROFILE_PATH" | grep -A1 -i "<key>UUID</key>" | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p' | tr -d '[:space:]')

          if [ -z "$PROFILE_UUID" ]; then
            echo "::error::No se pudo extraer el UUID del perfil de aprovisionamiento."
            exit 1
          fi

          echo "UUID del perfil de aprovisionamiento detectado: $PROFILE_UUID"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

      - name: Archivar proyecto Xcode (Clean Archive)
        working-directory: mobile/ios/App
        run: |
          echo "Iniciando xcodebuild clean archive..."
          xcodebuild clean archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration ${{ github.event.inputs.build_mode || 'Release' }} \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/eBand.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            -allowProvisioningUpdates=NO

      - name: Generar ExportOptions.plist y exportar .ipa
        run: |
          echo "Generando manifiesto ExportOptions.plist..."
          EXPORT_METHOD="app-store"

          cat <<EOF > "$RUNNER_TEMP/ExportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${EXPORT_METHOD}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>es.eband.app</key>
                  <string>${PROFILE_UUID}</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>destination</key>
              <string>export</string>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          mkdir -p "$RUNNER_TEMP/export"

          echo "Exportando archivo .ipa con xcodebuild -exportArchive..."
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/eBand.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates=NO

      - name: Subir artefacto IPA de la App iOS
        uses: actions/upload-artifact@v4
        with:
          name: eband-ios-${{ github.event.inputs.build_mode || 'Release' }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Limpieza de seguridad post-ejecución
        if: always()
        run: |
          echo "Ejecutando limpieza de credenciales y llavero..."
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security default-keychain -s login.keychain-db 2>/dev/null || true
            security list-keychains -d user -s login.keychain-db 2>/dev/null || true
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

          if [ -n "$CERTIFICATE_PATH" ] && [ -f "$CERTIFICATE_PATH" ]; then
            rm -f "$CERTIFICATE_PATH"
          fi

          if [ -n "$PROFILE_PATH" ] && [ -f "$PROFILE_PATH" ]; then
            rm -f "$PROFILE_PATH"
          fi

          rm -f "$RUNNER_TEMP/ExportOptions.plist" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/eBand.xcarchive" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null || true
          echo "Limpieza completada."
