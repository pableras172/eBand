<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>eBand</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <div class="container">
    <!-- Cabecera de Marca -->
    <header class="brand-header">
      <img src="img/logo.png" alt="eBand" class="brand-logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' rx=\'20\' fill=\'%232563eb\'/><text x=\'50\' y=\'62\' font-size=\'42\' font-family=\'sans-serif\' font-weight=\'bold\' fill=\'white\' text-anchor=\'middle\'>eB</text></svg>'">
      <h1 class="brand-title">eBand</h1>
      <p class="brand-subtitle">Tu agrupación musical siempre contigo</p>
    </header>

    <!-- Paso 1: Introducir Código -->
    <section id="step-code" class="card">
      <div id="error-alert" class="alert-error"></div>

      <form id="code-form" onsubmit="event.preventDefault(); window.app.handleValidateCode();">
        <div class="form-group">
          <label for="band-code" class="form-label">Código de tu agrupación</label>
          <input 
            type="text" 
            id="band-code" 
            class="form-input" 
            placeholder="EJ: BANDA-VALENCIA" 
            autocomplete="off" 
            autocorrect="off" 
            autocapitalize="characters" 
            spellcheck="false"
            required
          >
        </div>

        <button type="submit" id="btn-validate" class="btn btn-primary">
          <span class="btn-text">Continuar</span>
          <div class="spinner" id="btn-spinner"></div>
        </button>
      </form>

      <!-- Caja de depuración / logs -->
      <div id="debug-log" style="display: none; margin-top: 16px; padding: 10px; background: rgba(0,0,0,0.05); border-radius: 8px; font-family: monospace; font-size: 11px; max-height: 120px; overflow-y: auto; text-align: left; word-break: break-all;"></div>
    </section>

    <!-- Paso 2: Confirmar Agrupación (Oculto inicialmente) -->
    <section id="step-confirm" class="card band-preview">
      <img id="preview-logo" src="" alt="Escudo de la banda" class="band-preview-logo">
      <h2 id="preview-name" class="band-preview-name">Nombre de la Banda</h2>
      <p id="preview-location" class="band-preview-location" style="display: none;"></p>
      <span id="preview-code" class="band-preview-code">CÓDIGO</span>

      <!-- Enlaces sociales / web de la banda -->
      <div id="social-links" class="social-links">
        <button type="button" id="social-web" class="social-btn" title="Sitio Web" style="display: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        </button>
        <button type="button" id="social-instagram" class="social-btn" title="Instagram" style="display: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        </button>
        <button type="button" id="social-facebook" class="social-btn" title="Facebook" style="display: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
        </button>
        <button type="button" id="social-tiktok" class="social-btn" title="TikTok" style="display: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path></svg>
        </button>
      </div>

      <button type="button" id="btn-confirm" class="btn btn-primary" onclick="window.app.handleConfirmBand();">
        <span>Acceder a mi banda</span>
      </button>

      <button type="button" class="btn btn-secondary" onclick="window.app.handleCancelPreview();">
        <span>Introducir otro código</span>
      </button>
    </section>
  </div>

  <!-- Pantalla de Contingencia Sin Conexión -->
  <div id="offline-screen" class="offline-screen">
    <div class="offline-icon">📡</div>
    <h2>Sin conexión a internet</h2>
    <p style="color: var(--text-muted); margin: 8px 0 24px 0; font-size: 14px;">
      Comprueba tu conexión Wi-Fi o datos móviles para continuar usando eBand.
    </p>
    <button type="button" class="btn btn-primary" style="max-width: 240px;" onclick="window.app.retryConnection();">
      <span>Reintentar conexión</span>
    </button>
  </div>

  <!-- Pantalla de Desbloqueo Biométrico -->
  <div id="biometric-screen" class="offline-screen">
    <div class="offline-icon">🔒</div>
    <h2>Acceso protegido</h2>
    <p style="color: var(--text-muted); margin: 8px 0 24px 0; font-size: 14px;">
      Identifícate con tu huella o rostro para continuar a tu agrupación.
    </p>
    <button type="button" class="btn btn-primary" style="max-width: 240px;" onclick="window.app.retryBiometrics();">
      <span>Desbloquear con Biometría</span>
    </button>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
