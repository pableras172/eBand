<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sin conexion - eBand</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #06b6d4;
      --accent-dark: #0891b2;
      --border: #dbe3ef;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Figtree, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(circle at top right, rgba(6, 182, 212, 0.12), transparent 45%), var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    .card {
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 1.5rem;
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
    }

    .icon {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
      font-size: 1.4rem;
      margin-bottom: 1rem;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      line-height: 1.25;
    }

    p {
      margin: 0.75rem 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    button {
      margin-top: 1.25rem;
      border: 0;
      border-radius: 0.85rem;
      padding: 0.75rem 1rem;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #00131a;
    }
  </style>
</head>
<body>
  <article class="card">
    <div class="icon">📡</div>
    <h1>Estas sin conexion</h1>
    <p>No hemos podido cargar esta pagina. Revisa tu red e intenta de nuevo. Si ya visitaste esta seccion antes, podra abrirse en modo offline.</p>
    <button type="button" onclick="window.location.reload()">Reintentar</button>
  </article>
</body>
</html>
